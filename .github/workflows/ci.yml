name: CI
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x mac-setup.sh

  # 새 맥 경로(do_)를 실제로 돌려 보고, 두 번째 실행이 전부 '이미 됨'인지 확인
  run-twice:
    runs-on: macos-latest
    env:
      # 입력이 필요한 항목·CI 맥에서 못 도는 항목·큰 앱은 끔
      CI_SKIP: ssh_key ssh_keychain gh_login ssh_key_github volume_min google-drive google-chrome claude chatgpt discord gh
    steps:
      - uses: actions/checkout@v5
      - name: git 이름·이메일 (입력 대신 미리 설정)
        run: git config --global user.name CI && git config --global user.email ci@example.com
      - name: --help·--dry-run
        run: bash mac-setup.sh --help && bash mac-setup.sh --dry-run
      - name: 1회차
        run: bash mac-setup.sh || { tail -n 40 ~/Library/Logs/mac-setup.log; exit 1; }
      - name: 2회차 (전부 이미 됨)
        run: bash mac-setup.sh | tee out.txt && grep -q '전부 이미 됨' out.txt
