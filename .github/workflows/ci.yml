name: CI
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x mac-setup.sh config.example.sh

  # 새 맥 경로(do_)를 실제로 돌려 보고, 두 번째 실행이 전부 '이미 됨'인지 확인
  run-twice:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: config.sh (입력이 필요한 항목·큰 앱은 끔)
        run: |
          cat > config.sh <<'EOF'
          GIT_NAME="CI"
          GIT_EMAIL="ci@example.com"
          SKIP_TASKS=(ssh_key ssh_keychain gh_login ssh_key_github volume_min google-drive google-chrome claude chatgpt discord gh)
          EOF
      - name: --help·--dry-run
        run: bash mac-setup.sh --help && bash mac-setup.sh --dry-run
      - name: 1회차
        run: bash mac-setup.sh || { tail -n 40 ~/Library/Logs/mac-setup.log; exit 1; }
      - name: 2회차 (전부 이미 됨)
        run: bash mac-setup.sh | tee out.txt && grep -q '전부 이미 됨' out.txt
